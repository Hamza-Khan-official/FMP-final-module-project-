<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="nav.css">
    <title>Document</title>
</head>
<style>
    /* General Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Arial', sans-serif;
}

/* Navbar Styling */
.navbar {
    background-color: #120808;
    padding: 0.8rem 0;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
}

/* Logo */
.logo {
    height: 45px;
    width: auto;
}

/* Search Container */
.search-container {
    position: relative;
    width: 100%;
    max-width: 500px;
}

.search-input {
    width: 100%;
    padding: 12px 50px 12px 20px;
    border: none;
    border-radius: 25px;
    background-color: #f5f5f5;
    font-size: 14px;
    outline: none;
    transition: all 0.3s ease;
}

.search-input:focus {
    background-color: #ffffff;
    box-shadow: 0 0 0 2px rgba(255, 184, 0, 0.3);
}

.search-input::placeholder {
    color: #999;
}

.search-btn {
    position: absolute;
    right: 5px;
    top: 50%;
    transform: translateY(-50%);
    background-color: #ffb800;
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.3s ease;
}

.search-btn:hover {
    background-color: #e5a600;
}

.search-btn i {
    color: #2d2d2d;
    font-size: 16px;
}

/* Navbar Right Section */
.navbar-right {
    gap: 0;
}

/* Contact Items */
.contact-item {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    border-right: 1px solid #444;
    padding-right: 20px;
}

.contact-label {
    color: #ffb800;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    margin-bottom: 3px;
}

.contact-info {
    display: flex;
    align-items: center;
    color: #ffffff;
    font-size: 14px;
    font-weight: 500;
}

.contact-info i {
    color: #ffb800;
    font-size: 16px;
}

.contact-number {
    white-space: nowrap;
}

/* Auth Section */
.auth-section {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    border-right: 1px solid #444;
    padding-right: 20px;
}

.auth-link {
    color: #ffb800;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    text-decoration: none;
    margin-bottom: 3px;
}

.auth-link:hover {
    color: #e5a600;
}

.account-dropdown {
    color: #ffffff;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
}

.account-dropdown:hover {
    color: #ffb800;
}

.account-dropdown i {
    font-size: 12px;
}

/* Cart Section */
.cart-link {
    display: flex;
    align-items: center;
    color: #ffffff;
    text-decoration: none;
    position: relative;
    padding: 8px 15px;
    transition: color 0.3s ease;
}

.cart-link:hover {
    color: #ffb800;
}

.cart-link i {
    font-size: 20px;
    margin-right: 8px;
}

.cart-text {
    font-size: 14px;
    font-weight: 500;
}

.cart-badge {
    position: absolute;
    top: 2px;
    right: 8px;
    background-color: #ff4444;
    color: white;
    font-size: 10px;
    font-weight: bold;
    padding: 2px 6px;
    border-radius: 10px;
    min-width: 18px;
    text-align: center;
}

/* Mobile Responsive */
@media (max-width: 991px) {
    .search-container {
        max-width: 100%;
        margin: 15px 0;
    }

    .navbar-right {
        flex-direction: column;
        align-items: flex-start !important;
        width: 100%;
        gap: 15px;
    }

    .contact-item,
    .auth-section {
        border-right: none;
        border-bottom: 1px solid #444;
        padding-right: 0;
        padding-bottom: 10px;
        width: 100%;
    }

    .cart-section {
        width: 100%;
    }

    .cart-link {
        padding: 8px 0;
    }
}

@media (max-width: 576px) {
    .logo {
        height: 35px;
    }

    .search-input {
        padding: 10px 45px 10px 15px;
        font-size: 13px;
    }

    .search-btn {
        width: 35px;
        height: 35px;
    }

    .contact-info,
    .account-dropdown,
    .cart-text {
        font-size: 13px;
    }
}
</style>
<body>
    <!-- Navbar -->
    <nav id="Navbar" class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid px-4">
            <!-- Logo -->
            <a class="navbar-brand" href="#">
                <img src="../images/a4logo_2.svg" alt="PhoneBot Logo" class="logo" style="height: 30px;">
            </a>

            <!-- Mobile Toggle Button -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navbar Content -->
            <div class="collapse navbar-collapse" id="navbarContent">
                <!-- Search Bar -->
                <div class="search-container mx-auto">
                    <input type="text" class="search-input" placeholder="I'm shopping for...">
                    <button class="search-btn">
                        <i class="fas fa-search"></i>
                    </button>
                </div>

                <!-- Right Side Items -->
                <div class="navbar-right d-flex align-items-center ms-auto">
                    <!-- Call Us -->
                    <div class="contact-item me-4">
                        <span class="contact-label">Call us</span>
                        <div class="contact-info">
                            <i class="fas fa-phone-alt me-2"></i>
                            <span class="contact-number">(03) 94626936</span>
                        </div>
                    </div>

                    <!-- WhatsApp -->
                    <div class="contact-item me-4">
                        <span class="contact-label">On Whatsapp</span>
                        <div class="contact-info">
                            <i class="fab fa-whatsapp me-2"></i>
                            <span class="contact-number">+61394626936</span>
                        </div>
                    </div>

                    <!-- Login/Register -->
                    <div class="auth-section me-4">
                        <a href="#" class="auth-link">Login / Register</a>
                        <div class="account-dropdown">
                            <span>My Account</span>
                            <i class="fas fa-chevron-down ms-1"></i>
                        </div>
                    </div>

                    <!-- Cart -->
                    <div class="cart-section">
                        <a href="../../Products/mouse/mouse_cart/mouse_cart.html" class="cart-link">
                            <i class="fas fa-shopping-cart"></i>
                            <span class="cart-text">Cart</span>
                            <span class="cart-badge">0</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
