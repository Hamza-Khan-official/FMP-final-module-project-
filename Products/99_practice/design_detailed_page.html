<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Listing - Category</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #fff;
      color: #000;
      margin: 0;
      padding: 0;
    }

    h2.category-title {
      text-align: center;
      margin: 50px 0 30px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #222;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 25px;
      max-width: 1100px;
      margin: auto;
      padding: 0 20px;
    }

    .product-card {
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      text-align: center;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
      transition: all 0.4s ease;
      border: 1px solid #eee;
      cursor: pointer;
    }

    .product-card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      border-color: #ddd;
    }

    .product-card img {
      width: 100%;
      height: 160px;
      object-fit: contain;
      transition: all 0.4s ease;
    }

    .product-card:hover img {
      transform: scale(1.05);
    }

    .product-card h5 {
      margin-top: 15px;
      font-size: 1rem;
      font-weight: 500;
      color: #333;
    }

    .product-card .badge {
      font-size: 0.7rem;
      background: linear-gradient(135deg, #007bff, #00c4ff);
      padding: 5px 8px;
      border-radius: 8px;
      color: white;
      position: absolute;
      top: 15px;
      right: 15px;
    }

    .product-card .btn {
      margin-top: 10px;
      border-radius: 25px;
      padding: 6px 18px;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .product-card .btn:hover {
      background-color: #000;
      color: #fff;
    }

    @media (max-width: 600px) {
      .product-card img {
        height: 140px;
      }
    }
  </style>
</head>
<body>

  <h2 class="category-title">Category</h2>

  <div class="product-grid">

    <div class="product-card position-relative">
      <span class="badge">Bluetooth</span>
      <img src="images/mouse/mouse_1.jpg" alt="Mouse 1">
      <h5>FG35C Air</h5>
      <button class="btn btn-outline-dark">View Details</button>
    </div>

    <div class="product-card position-relative">
      <span class="badge">Wired</span>
      <img src="images//mouse/mouse_2.jpg" alt="Mouse 2">
      <h5>FG35C / FG35C Pro</h5>
      <button class="btn btn-outline-dark">View Details</button>
    </div>

    <div class="product-card position-relative">
      <span class="badge">Bluetooth</span>
      <img src="images//mouse/mouse_3.jpg" alt="Mouse 3">
      <h5>FG20 / FG20K</h5>
      <button class="btn btn-outline-dark">View Details</button>
    </div>

    <div class="product-card position-relative">
      <span class="badge">Wired</span>
      <img src="images//mouse/mouse_4.jpg" alt="Mouse 4">
      <h5>FG35 Air</h5>
      <button class="btn btn-outline-dark">View Details</button>
    </div>

    <div class="product-card position-relative">
      <span class="badge">Bluetooth</span>
      <img src="images//mouse/mouse_5.jpg" alt="Mouse 5">
      <h5>FG25 / FG25K</h5>
      <button class="btn btn-outline-dark">View Details</button>
    </div>

  </div>

  <br><br>

</body>
</html>
